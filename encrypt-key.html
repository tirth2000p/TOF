<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encrypt TOEFL App Keys</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 850px; margin: 35px auto; padding: 20px; background: #f7f9fc; color: #1f2937; }
    .card { background: white; border-radius: 16px; padding: 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    textarea, input, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d0d7e2; font-size: 15px; margin-top: 8px; box-sizing: border-box; }
    textarea { min-height: 140px; }
    button { background: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
    pre { white-space: pre-wrap; background: #f1f5f9; padding: 14px; border-radius: 10px; overflow-wrap: anywhere; }
    .hint { color: #64748b; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Encrypt API Keys</h1>
    <p class="hint">
      Paste one Gemini key per line, enter a passphrase, then download <b>keys.enc</b>.
      Put <b>keys.enc</b> beside <b>index.html</b>. The main app will ask for your passphrase.
      This only hides the key casually; browser-only apps cannot truly protect secrets.
    </p>
    <label>API Keys, one per line</label>
    <textarea id="keys" placeholder="AIza...&#10;AIza..."></textarea>
    <label>Passphrase</label>
    <input id="passphrase" type="password" placeholder="Enter passphrase" />
    <button onclick="encryptAndDownload()">Encrypt and Download keys.enc</button>
    <h3>Status</h3>
    <pre id="status">Ready.</pre>
  </div>
<script>
async function encryptAndDownload() {
  const keys = document.getElementById("keys").value.trim();
  const passphrase = document.getElementById("passphrase").value;
  if (!keys) { alert("Paste at least one API key."); return; }
  if (!passphrase || passphrase.length < 6) { alert("Use a passphrase with at least 6 characters."); return; }

  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));

  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt"]
  );

  const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(keys));
  const payload = {
    version: 1,
    algorithm: "AES-GCM",
    kdf: "PBKDF2-SHA256",
    iterations: 150000,
    salt: arrayBufferToBase64(salt),
    iv: arrayBufferToBase64(iv),
    data: arrayBufferToBase64(encrypted)
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "keys.enc";
  a.click();
  URL.revokeObjectURL(url);

  document.getElementById("status").textContent = "Downloaded keys.enc. Put it beside index.html. You may delete keys.txt if you use keys.enc.";
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
</script>
</body>
</html>
