<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEFL AI Examiner</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      margin-top: 16px;
      display: block;
    }

    select, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
    }

    button {
      background: #1a73e8;
      color: white;
      border: none;
      margin-top: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1558b0;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > div {
      flex: 1;
    }

    #timer {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
      color: #1a73e8;
    }

    #feedback {
      white-space: pre-wrap;
      background: #f9fafc;
      padding: 18px;
      border-radius: 10px;
      margin-top: 20px;
      border: 1px solid #ddd;
    }

    .small {
      font-size: 13px;
      color: #777;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>TOEFL AI Examiner</h1>
    <p class="subtitle">Practice TOEFL Speaking and Writing with AI feedback</p>

    <div class="row">
      <div>
        <label>Section</label>
        <select id="section" onchange="setDefaultQuestion()">
          <option value="Speaking">Speaking</option>
          <option value="Writing">Writing</option>
        </select>
      </div>

      <div>
        <label>Question Type</label>
        <select id="questionType" onchange="setDefaultQuestion()">
          <option value="Independent">Independent</option>
          <option value="Academic">Academic</option>
          <option value="Integrated">Integrated</option>
        </select>
      </div>
    </div>

    <label>Question</label>
    <textarea id="question" rows="4"></textarea>

    <button onclick="generateQuestion()">Generate New Question</button>

    <div id="timer">00:00</div>

    <div class="row">
      <button onclick="startTimer()">Start Timer</button>
      <button onclick="resetTimer()">Reset Timer</button>
    </div>

    <label>Your Answer</label>
    <textarea id="answer" rows="10" placeholder="Type your speaking transcript or writing response here..."></textarea>

    <button onclick="gradeAnswer()">Get AI Examiner Feedback</button>

    <div id="feedback">Feedback will appear here.</div>

    <p class="small">
      Personal-use app. Do not share publicly if your API key is hardcoded.
    </p>
  </div>

  <script>
    // Replace this with your Gemini API key
    const GEMINI_API_KEY = "PASTE_YOUR_GEMINI_API_KEY_HERE";

    let timerInterval;
    let seconds = 0;

    const sampleQuestions = {
      Speaking: {
        Independent: "Some people prefer to study alone, while others prefer to study with a group. Which do you prefer and why?",
        Academic: "Explain how online learning can affect student motivation. Use specific examples.",
        Integrated: "The university plans to close the campus gym for renovation. The student disagrees with the decision. Summarize the announcement and the student's opinion."
      },
      Writing: {
        Independent: "Do you agree or disagree with the following statement? Students should be required to take classes outside their major. Use reasons and examples.",
        Academic: "Summarize the main points from a lecture that challenges the reading passage about renewable energy.",
        Integrated: "A reading passage claims that remote work improves productivity. A lecture challenges this claim. Summarize both views."
      }
    };

    function setDefaultQuestion() {
      const section = document.getElementById("section").value;
      const type = document.getElementById("questionType").value;
      document.getElementById("question").value = sampleQuestions[section][type];
      resetTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);

      const section = document.getElementById("section").value;

      // TOEFL-style rough timing
      seconds = section === "Speaking" ? 45 : 30 * 60;

      updateTimerDisplay();

      timerInterval = setInterval(() => {
        seconds--;
        updateTimerDisplay();

        if (seconds <= 0) {
          clearInterval(timerInterval);
          alert("Time is up!");
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      seconds = 0;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      document.getElementById("timer").innerText =
        String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
    }

    async function generateQuestion() {
      const section = document.getElementById("section").value;
      const type = document.getElementById("questionType").value;

      document.getElementById("feedback").innerText = "Generating question...";

      const prompt = `
Generate one realistic TOEFL ${section} ${type} practice question.
Only return the question. Do not include explanation.
`;

      const text = await callGemini(prompt);
      document.getElementById("question").value = text;
      document.getElementById("feedback").innerText = "New question generated.";
    }

    async function gradeAnswer() {
      const section = document.getElementById("section").value;
      const type = document.getElementById("questionType").value;
      const question = document.getElementById("question").value;
      const answer = document.getElementById("answer").value;

      if (!answer.trim()) {
        alert("Please enter your answer first.");
        return;
      }

      document.getElementById("feedback").innerText = "AI examiner is checking your answer...";

      const prompt = `
You are a strict but helpful TOEFL examiner.

Section: ${section}
Question Type: ${type}

Question:
${question}

Student Answer:
${answer}

Evaluate this like a real TOEFL examiner.

Return the response in this format:

Estimated TOEFL Score:
- Give a score estimate.
- For Speaking, use 0-4 and convert to approximate TOEFL speaking score.
- For Writing, use 0-5 and convert to approximate TOEFL writing score.

Overall Feedback:

Strengths:

Weaknesses:

Grammar Corrections:

Vocabulary Improvements:

Organization / Fluency Feedback:

Improved Sample Answer:

3 Specific Practice Tips:
`;

      const text = await callGemini(prompt);
      document.getElementById("feedback").innerText = text;
    }

    async function callGemini(prompt) {
      try {
        const response = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + GEMINI_API_KEY,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              contents: [
                {
                  parts: [
                    { text: prompt }
                  ]
                }
              ]
            })
          }
        );

        const data = await response.json();

        return data?.candidates?.[0]?.content?.parts?.[0]?.text ||
          "Error:\n" + JSON.stringify(data, null, 2);

      } catch (error) {
        return "Error calling Gemini API: " + error.message;
      }
    }

    setDefaultQuestion();
  </script>
</body>
</html>
