<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOEFL AI Examiner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f7f9fc);
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
      font-size: 38px;
      text-align: center;
      color: #1a73e8;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .field {
      flex: 1;
      min-width: 250px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select,
    textarea,
    button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #d0d7e2;
      padding: 12px;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.5;
    }

    button {
      background: #1a73e8;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s ease;
    }

    button:hover {
      background: #1559b7;
      transform: translateY(-1px);
    }

    .secondary {
      background: #f1f4f9;
      color: #333;
    }

    .secondary:hover {
      background: #dce5f2;
    }

    #timer {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #1a73e8;
      margin-top: 10px;
    }

    #feedback {
      background: #f7f9fc;
      border: 1px solid #d9e1ee;
      border-radius: 14px;
      padding: 18px;
      white-space: pre-wrap;
      line-height: 1.6;
      min-height: 120px;
    }

    .badge {
      display: inline-block;
      background: #e8f0fe;
      color: #1a73e8;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="card">
      <h1>TOEFL AI Examiner</h1>
      <div class="subtitle">
        Full TOEFL Reading, Listening, Speaking, and Writing Practice
      </div>

      <div class="row">

        <div class="field">
          <label>Section</label>
          <select id="section" onchange="updateUI()">
            <option value="Reading">Reading</option>
            <option value="Listening">Listening</option>
            <option value="Speaking">Speaking</option>
            <option value="Writing">Writing</option>
          </select>
        </div>

        <div class="field">
          <label>Question Type</label>
          <select id="questionType" onchange="updateUI()">
            <option value="Passage Questions">Passage Questions</option>
            <option value="Lecture Questions">Lecture Questions</option>
            <option value="Campus Conversation">Campus Conversation</option>
            <option value="Independent">Independent</option>
            <option value="Integrated">Integrated</option>
            <option value="Academic Discussion">Academic Discussion</option>
          </select>
        </div>

      </div>
    </div>

    <div class="card">
      <div class="badge">Practice Task</div>

      <div class="row">
        <button onclick="generateQuestion()">
          Generate TOEFL Practice Task
        </button>
      </div>

      <br />

      <textarea id="question"></textarea>

      <br /><br />

      <div class="row" id="audioControls" style="display:none;">
        <button onclick="playQuestionAudio()">
          🔊 Play Listening Audio
        </button>

        <button class="secondary" onclick="stopAudio()">
          ⏹ Stop Audio
        </button>
      </div>

      <br />

      <div id="timer">00:00</div>

      <br />

      <div class="row">
        <button onclick="startTimer()">▶ Start Timer</button>
        <button class="secondary" onclick="resetTimer()">↺ Reset Timer</button>
      </div>
    </div>

    <div class="card">
      <div class="badge">Your Response</div>

      <div class="row" id="micControls" style="display:none;">
        <button onclick="startSpeaking()">🎤 Start Speaking</button>
        <button class="secondary" onclick="stopSpeaking()">⏹ Stop Speaking</button>
      </div>

      <br />

      <textarea
        id="answer"
        placeholder="Type your answer or use speaking mode..."
      ></textarea>

      <br /><br />

      <button onclick="gradeAnswer()">
        Get AI Examiner Feedback
      </button>
    </div>

    <div class="card">
      <div class="badge">AI Feedback</div>
      <div id="feedback">Feedback will appear here.</div>
    </div>
  </div>

<script>

let recognition;
let timerInterval;
let seconds = 0;

let speechQueue = [];
let currentSpeechIndex = 0;
let isStopped = false;

let GEMINI_API_KEY = "";

async function loadApiKey() {
  try {
    const response = await fetch("./key.txt");
    GEMINI_API_KEY = (await response.text()).trim();
  } catch (e) {
    alert("Missing API key. Add your Gemini API key to key.txt.");
  }
}

window.speechSynthesis.onvoiceschanged = () => {
  speechSynthesis.getVoices();
};

function updateUI() {

  const section =
    document.getElementById("section").value;

  const typeSelect =
    document.getElementById("questionType");

  const options =
    Array.from(typeSelect.options);

  // Hide all first
  options.forEach(option => {
    option.hidden = true;
  });

  // =========================
  // SHOW VALID TYPES
  // =========================

  if (section === "Reading") {

    showOption("Passage Questions");
    typeSelect.value = "Passage Questions";
  }

  else if (section === "Listening") {

    showOption("Lecture Questions");
    showOption("Campus Conversation");

    if (
      typeSelect.value !== "Lecture Questions" &&
      typeSelect.value !== "Campus Conversation"
    ) {
      typeSelect.value = "Lecture Questions";
    }
  }

  else if (section === "Speaking") {

    showOption("Independent");
    showOption("Integrated");

    if (
      typeSelect.value !== "Independent" &&
      typeSelect.value !== "Integrated"
    ) {
      typeSelect.value = "Independent";
    }
  }

  else if (section === "Writing") {

    showOption("Integrated");
    showOption("Academic Discussion");

    if (
      typeSelect.value !== "Integrated" &&
      typeSelect.value !== "Academic Discussion"
    ) {
      typeSelect.value = "Integrated";
    }
  }

  function showOption(value) {

    const option =
      [...typeSelect.options].find(
        o => o.value === value
      );

    if (option) {
      option.hidden = false;
    }
  }

  // =========================
  // AUDIO/MIC UI
  // =========================

  const type = typeSelect.value;

  const audioControls =
    document.getElementById("audioControls");

  const micControls =
    document.getElementById("micControls");

  const showAudio =
    section === "Listening" ||
    (
      (section === "Speaking" || section === "Writing") &&
      type === "Integrated"
    );

  audioControls.style.display =
    showAudio ? "flex" : "none";

  micControls.style.display =
    section === "Speaking" ? "flex" : "none";
}

function startTimer() {

  clearInterval(timerInterval);

  const section = document.getElementById("section").value;
  const type = document.getElementById("questionType").value;

  if (section === "Reading") seconds = 35 * 60;
  else if (section === "Listening") seconds = 36 * 60;
  else if (section === "Speaking") seconds = 60;
  else if (section === "Writing" && type === "Integrated") seconds = 20 * 60;
  else if (section === "Writing" && type === "Academic Discussion") seconds = 10 * 60;
  else seconds = 10 * 60;

  updateTimerDisplay();

  timerInterval = setInterval(() => {

    seconds--;

    updateTimerDisplay();

    if (seconds <= 0) {
      clearInterval(timerInterval);
      alert("Time is up!");
    }

  }, 1000);
}

function resetTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  updateTimerDisplay();
}

function updateTimerDisplay() {

  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;

  document.getElementById("timer").innerText =
    String(mins).padStart(2, "0") + ":" +
    String(secs).padStart(2, "0");
}

async function generateQuestion() {

  const section = document.getElementById("section").value;
  const type = document.getElementById("questionType").value;

  document.getElementById("feedback").innerText = "Generating TOEFL task...";

  let prompt = "";

  if (section === "Reading") {

    prompt = `
Generate a realistic TOEFL Reading practice.

Create:
- One academic reading passage around 600-700 words.
- 10 multiple-choice questions.
- Use realistic TOEFL formatting.
`;
  }

  else if (section === "Listening") {

    if (type === "Lecture Questions") {

        prompt = `
    Generate a realistic TOEFL Academic Lecture listening set.

    Format EXACTLY as:

    ## AUDIO SCRIPT

    (dialogue/lecture)
    
    ---

    ## QUESTIONS

    Requirements:
    - 500-700 word university lecture.
    - Professor speaking most of the time.
    - Optional student interruptions/questions.
    - 6 TOEFL multiple-choice questions.
    - Realistic TOEFL style.
    `;
      }

      else if (type === "Campus Conversation") {

        prompt = `
    Generate a realistic TOEFL Campus Conversation listening set.

    Format EXACTLY as:

    ## AUDIO SCRIPT

    (conversation)

    ---

    ## QUESTIONS

    Requirements:
    - 350-500 word university campus conversation.
    - Student + professor/staff dialogue.
    - Realistic campus problem or academic situation.
    - 5 TOEFL multiple-choice questions.
    - Realistic TOEFL style.
    `;
      }
  }

  else if (section === "Speaking" && type === "Independent") {

    prompt = `
Generate one realistic TOEFL Independent Speaking task.

Include:
- speaking prompt
- preparation time
- speaking time
`;
  }

  else if (section === "Speaking" && type === "Integrated") {

    prompt = `
Generate a realistic TOEFL Integrated Speaking task.

Format EXACTLY as:

## READING PASSAGE

(text)

## LISTENING SCRIPT

(dialogue/lecture)

## SPEAKING PROMPT

(prompt)

Requirements:
- Reading: 80-120 words.
- Listening script: 180-280 words.
- Realistic TOEFL style.
`;
  }

  else if (section === "Writing" && type === "Integrated") {

    prompt = `
Generate a realistic TOEFL Integrated Writing task.

Format EXACTLY as:

## READING PASSAGE

(text)

## LISTENING SCRIPT

(lecture)

## WRITING PROMPT

(prompt)

Requirements:
- Reading: 250-300 words.
- Listening script: 250-350 words.
- Realistic TOEFL style.
`;
  }

  else if (section === "Writing" && type === "Academic Discussion") {

    prompt = `
Generate a TOEFL Academic Discussion writing task.

Include:
- professor question
- two student responses
- response prompt
`;
  }

  const text = await callGemini(prompt);

  document.getElementById("question").value = text;

  document.getElementById("feedback").innerText = "Practice task generated.";
}

async function gradeAnswer() {

  const section = document.getElementById("section").value;
  const type = document.getElementById("questionType").value;

  const question = document.getElementById("question").value;
  const answer = document.getElementById("answer").value;

  if (!answer.trim()) {
    alert("Please enter an answer.");
    return;
  }

  document.getElementById("feedback").innerText = "AI examiner reviewing your response...";

  const prompt = `
You are a TOEFL examiner.

Section: ${section}
Question Type: ${type}

Task:
${question}

Student Response:
${answer}

Evaluate according to real TOEFL scoring.

Return:
1. Estimated score
2. Strengths
3. Weaknesses
4. Grammar/vocabulary improvements
5. Better sample response
6. 3 improvement tips
`;

  const text = await callGemini(prompt);

  document.getElementById("feedback").innerText = text;
}

async function callGemini(prompt) {

  try {

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=" + GEMINI_API_KEY,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              parts: [
                { text: prompt }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    return data?.candidates?.[0]?.content?.parts?.[0]?.text ||
      JSON.stringify(data, null, 2);

  } catch (error) {

    return "Error: " + error.message;
  }
}

async function playQuestionAudio() {

  stopAudio();

  const fullText = document.getElementById("question").value;

  if (!fullText.trim()) {
    alert("No audio available.");
    return;
  }

  const section = document.getElementById("section").value;
  const type = document.getElementById("questionType").value;

  let audioText = "";

  if (section === "Listening") {

    const match =
      fullText.match(
        /##\s*AUDIO SCRIPT\s*([\s\S]*?)---/i
      );

    audioText = match ? match[1] : "";
  }

  else if (
    (section === "Speaking" || section === "Writing") &&
    type === "Integrated"
  ) {

    const match =
      fullText.match(
        /##\s*LISTENING SCRIPT\s*([\s\S]*?)##\s*(SPEAKING|WRITING)\s*PROMPT/i
      );

    audioText = match ? match[1] : "";
  }

  if (!audioText.trim()) {
    alert("No listening script found.");
    return;
  }

  audioText = audioText.replace(/\(.*?\)/g, "");
  audioText = audioText.replace(/\*\*/g, "");
  audioText = audioText.replace(/##.*$/gm, "");
  audioText = audioText.replace(/\n{2,}/g, "\n");

  const lines = audioText
    .split("\n")
    .map(l => l.trim())
    .filter(l => l.length > 0);

  speechQueue = [];

  const voices = speechSynthesis.getVoices();

  const maleVoice =
    voices.find(v => v.name.includes("Daniel")) ||
    voices.find(v => v.name.includes("Google US English")) ||
    voices[0];

  const femaleVoice =
    voices.find(v => v.name.includes("Samantha")) ||
    voices.find(v => v.name.includes("Jenny")) ||
    voices[1] ||
    voices[0];

  lines.forEach(line => {

    let voice = maleVoice;
    let text = line;

    if (line.includes(":")) {

      const parts = line.split(":");

      const speaker = parts[0].toLowerCase();

      text = parts.slice(1).join(":").trim();

      if (
        speaker.includes("student") ||
        speaker.includes("woman") ||
        speaker.includes("female") ||
        speaker.includes("mark")
      ) {
        voice = femaleVoice;
      }
    }

    if (text.length > 0) {
      speechQueue.push({
        text,
        voice
      });
    }
  });

  currentSpeechIndex = 0;
  isStopped = false;

  speakNext();
}

function speakNext() {

  if (isStopped) return;

  if (currentSpeechIndex >= speechQueue.length) {
    return;
  }

  const item = speechQueue[currentSpeechIndex];

  const utterance = new SpeechSynthesisUtterance(item.text);

  utterance.voice = item.voice;
  utterance.rate = 0.92;

  utterance.pitch =
    item.voice.name.includes("Samantha") ||
    item.voice.name.includes("Jenny")
      ? 1.08
      : 0.96;

  utterance.volume = 1;

  utterance.onend = () => {

    currentSpeechIndex++;

    setTimeout(() => {
      speakNext();
    }, 400);
  };

  speechSynthesis.speak(utterance);
}

function stopAudio() {
  isStopped = true;
  speechSynthesis.cancel();
}

function setupSpeechRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Speech recognition is not supported in this browser.");
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = function(event) {

    let transcript = "";

    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript + " ";
    }

    document.getElementById("answer").value = transcript;
  };
}

function startSpeaking() {

  if (!recognition) {
    setupSpeechRecognition();
  }

  recognition.start();
}

function stopSpeaking() {

  if (recognition) {
    recognition.stop();
  }
}

loadApiKey();
updateUI();

</script>
</body>
</html>
